services:
  - type: web
    name: fyind-product-classifier
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: FYIND_BASE_URL
        value: https://adminui-api.fyind.com
      - key: FYIND_REGION
        value: UAE
      - key: USE_MOCK_FYIND
        value: "false"
